  function openCrmForm(type){const todayText=today(),title={lead:'新增线索',opportunity:'新增商机',quote:'新增报价单',contract:'新增合同',campaign:'新增营销活动',ticket:'新增服务工单'}[type]||'新增记录';let body='';if(type==='lead')body='<div class="field"><label>线索名称</label><input id="rName" placeholder="例如：苏州云栖酒店采购"></div><div class="field"><label>公司名称</label><input id="rCompany" placeholder="例如：云栖酒店"></div><div class="form-row"><div class="field"><label>来源</label><input id="rSource" placeholder="展会 / 转介绍"></div><div class="field"><label>评分</label><input id="rScore" type="number" value="60"></div></div><div class="form-row"><div class="field"><label>状态</label><select id="rStatus"><option>待联系</option><option>跟进中</option><option>已转客户</option><option>无效</option></select></div><div class="field"><label>下次动作</label><input id="rNext" type="date" value="'+todayText+'"></div></div><div class="field"><label>备注</label><input id="rNote" placeholder="记录线索需求和下一步动作"></div>';if(type==='opportunity')body='<div class="field"><label>商机名称</label><input id="rName" placeholder="例如：客用品年度采购"></div><div class="field"><label>客户公司</label><input id="rCompany" placeholder="例如：华庭酒店"></div><div class="form-row"><div class="field"><label>阶段</label><select id="rStage"><option>需求确认</option><option>初步接洽</option><option>报价中</option><option>谈判中</option><option>赢单</option><option>输单</option></select></div><div class="field"><label>预计金额</label><input id="rAmount" type="number" placeholder="元"></div></div><div class="form-row"><div class="field"><label>成交概率 %</label><input id="rProbability" type="number" value="30"></div><div class="field"><label>下次跟进</label><input id="rNext" type="date" value="'+todayText+'"></div></div><div class="field"><label>备注</label><input id="rNote" placeholder="记录商机进展"></div>';if(type==='quote'||type==='contract')body='<div class="field"><label>客户公司</label><input id="rCompany" placeholder="例如：华庭酒店"></div><div class="field"><label>'+(type==='quote'?'报价单名称':'合同名称')+'</label><input id="rTitle" placeholder="例如：客用品年度合作"></div><div class="form-row"><div class="field"><label>金额</label><input id="rAmount" type="number" placeholder="元"></div><div class="field"><label>状态</label><input id="rStatusText" value="'+(type==='quote'?'草稿':'执行中')+'"></div></div><div class="form-row"><div class="field"><label>'+(type==='quote'?'有效至':'开始日期')+'</label><input id="rStart" type="date" value="'+todayText+'"></div>'+(type==='contract'?'<div class="field"><label>结束日期</label><input id="rEnd" type="date" value="'+dateText(30)+'"></div>':'')+'</div>';if(type==='ticket')body='<div class="field"><label>客户公司</label><input id="rCompany" placeholder="例如：华庭酒店"></div><div class="field"><label>工单标题</label><input id="rTitle" placeholder="例如：规格确认或售后问题"></div><div class="field"><label>优先级</label><select id="rPriority"><option>普通</option><option>重要</option><option>紧急</option></select></div><div class="field"><label>问题描述</label><input id="rContent" placeholder="记录客户问题和处理要求"></div>';if(type==='campaign')body='<div class="field"><label>活动名称</label><input id="rName" placeholder="例如：酒店客用品试用计划"></div><div class="form-row"><div class="field"><label>渠道</label><input id="rChannel" placeholder="微信社群 / 展会"></div><div class="field"><label>状态</label><select id="rCampaignStatus"><option>草稿</option><option>进行中</option><option>已结束</option></select></div></div><div class="form-row"><div class="field"><label>开始日期</label><input id="rStart" type="date" value="'+todayText+'"></div><div class="field"><label>结束日期</label><input id="rEnd" type="date" value="'+dateText(30)+'"></div></div><div class="field"><label>活动说明</label><input id="rNote" placeholder="记录活动目标和主推商品"></div>';shell(title,body+actions());document.getElementById('close').onclick=closeModal;document.getElementById('commit').onclick=()=>saveCrmRecord(type)}
  function saveCrmRecord(type){const val=id=>document.getElementById(id)?.value.trim()||'';if(type==='lead'){if(!val('rName')){alert('请输入线索名称');return}state.leads.unshift({id:Date.now(),name:val('rName'),company:val('rCompany'),source:val('rSource'),score:Number(val('rScore')||0),status:val('rStatus'),nextDate:val('rNext'),note:val('rNote')})}if(type==='opportunity'){if(!val('rName')){alert('请输入商机名称');return}state.opportunities.unshift({id:Date.now(),name:val('rName'),company:val('rCompany'),stage:val('rStage'),amount:Number(val('rAmount')||0),probability:Number(val('rProbability')||0),nextDate:val('rNext'),note:val('rNote')})}if(type==='quote')state.quotes.unshift({id:Date.now(),company:val('rCompany'),title:val('rTitle'),amount:Number(val('rAmount')||0),status:val('rStatusText'),validUntil:val('rStart')});if(type==='contract')state.contracts.unshift({id:Date.now(),company:val('rCompany'),title:val('rTitle'),amount:Number(val('rAmount')||0),status:val('rStatusText'),startDate:val('rStart'),endDate:val('rEnd')});if(type==='ticket')state.serviceTickets.unshift({id:Date.now(),company:val('rCompany'),title:val('rTitle'),priority:val('rPriority'),status:'待处理',createdAt:today(),content:val('rContent')});if(type==='campaign')state.campaigns.unshift({id:Date.now(),name:val('rName'),channel:val('rChannel'),status:val('rCampaignStatus'),startDate:val('rStart'),endDate:val('rEnd'),leadCount:0,convertedCount:0,note:val('rNote')});save();closeModal();render()}
  function openAppointment(company){shell('添加事项','<div class="field"><label>事项类型</label><select id="aType"><option>拜访</option><option>待办</option></select></div><div class="form-row"><div class="field"><label>酒店公司</label><input id="aCompany" value="'+esc(company||'')+'" placeholder="拜访对象"></div><div class="field"><label>事项内容</label><input id="aPurpose" placeholder="合作洽谈 / 准备报价"></div></div><div class="form-row"><div class="field"><label>开始日期</label><input id="aStart" type="date" value="'+dateText(1)+'"></div><div class="field"><label>结束日期</label><input id="aEnd" type="date" value="'+dateText(1)+'"></div></div><div class="form-row"><div class="field"><label>提前提醒天数</label><input id="aRemind" type="number" value="7" min="0"></div><div class="field"><label>备注</label><input id="aNote" placeholder="补充信息"></div></div>'+actions());document.getElementById('close').onclick=closeModal;document.getElementById('commit').onclick=()=>{const companyName=document.getElementById('aCompany').value.trim(),purpose=document.getElementById('aPurpose').value.trim();if(!purpose){alert('请输入事项内容');return}state.appointments.push({id:Date.now(),type:document.getElementById('aType').value,company:companyName,purpose,start:document.getElementById('aStart').value,end:document.getElementById('aEnd').value,remind:Number(document.getElementById('aRemind').value||0),note:document.getElementById('aNote').value.trim()});save();closeModal();tab='appointments';render()}}
  function openTypes(){shell('商品类型管理','<div class="type-add"><input id="typeInput" placeholder="输入新商品类型"><button id="addType">添加</button></div><div class="type-list">'+state.categories.map(x=>'<div class="type-row"><span>'+esc(x)+'</span><button class="delete-type" data-delete-type="'+esc(x)+'">删除</button></div>').join('')+'</div><div class="sheet-actions"><button class="confirm" id="close">完成</button></div>');document.getElementById('close').onclick=closeModal;document.getElementById('addType').onclick=()=>{const n=document.getElementById('typeInput').value.trim();if(!n){alert('请输入商品类型');return}if(state.categories.includes(n)){alert('该类型已存在');return}state.categories.push(n);save();openTypes()};document.querySelectorAll('[data-delete-type]').forEach(n=>n.onclick=()=>{const t=n.dataset.deleteType;if(state.inventory.some(x=>x.category===t)){alert('该类型已有库存商品，不能删除');return}state.categories=state.categories.filter(x=>x!==t);save();openTypes()})}
  function drawAnalysis(){const canvas=document.getElementById('analysisCanvas');if(!canvas)return;const rows=analysisRows(),spacing=state.settings.spacing||56,width=spacing*12+80,height=260;canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d'),pad={l:34,r:12,t:18,b:30},cw=width-pad.l-pad.r,ch=height-pad.t-pad.b;ctx.clearRect(0,0,width,height);const names=[...new Set(rows.map(x=>x.name))],colors=['#2f7d5b','#d77a57','#55709a','#7b5b91','#b36b24'];const series=names.map((name,i)=>({name,color:colors[i%colors.length],values:Array.from({length:12},(_,m)=>rows.filter(x=>x.name===name&&new Date(x.stamp).getMonth()===m).reduce((s,x)=>s+Number(x.quantity),0))}));const totals=Array.from({length:12},(_,m)=>rows.filter(x=>new Date(x.stamp).getMonth()===m).reduce((s,x)=>s+Number(x.quantity),0)),max=Math.max(1,...totals);ctx.strokeStyle='#e7ece7';ctx.lineWidth=1;for(let i=0;i<4;i++){const y=pad.t+ch*i/3;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(width-pad.r,y);ctx.stroke()}const point=(i,v)=>({x:pad.l+cw*i/11,y:pad.t+ch-(Math.max(0,v)/max)*ch});function line(values,color,w){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();values.forEach((v,i)=>{const p=point(i,v);if(i===0)ctx.moveTo(p.x,p.y);else{const prev=point(i-1,values[i-1]),mid=(prev.x+p.x)/2;ctx.bezierCurveTo(mid,prev.y,mid,p.y,p.x,p.y)}});ctx.stroke();values.forEach((v,i)=>{const p=point(i,v);ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();if(state.settings.showValues){ctx.fillStyle='#536059';ctx.font='10px sans-serif';ctx.fillText(String(v),p.x-7,p.y-8)}})}series.forEach(s=>line(s.values,s.color,2));line(totals,'#202624',2.4);ctx.fillStyle='#8b948d';ctx.font='10px sans-serif';for(let i=0;i<12;i++)ctx.fillText((i+1)+'月',point(i,0).x-8,height-8);const legend=document.getElementById('legend');if(legend)legend.innerHTML='<span><i style="background:#202624"></i>总销售量</span>'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>').join('')}
  document.getElementById('bottomAction').onclick=()=>openQuick();
  render();
</script>
